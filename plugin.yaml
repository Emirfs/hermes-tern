name: hermes-tern
label: Tern
version: 0.2.0
manifest_version: 2
kind: standalone
description: "Hermes for Tern: native chat, kanban, messaging and field-device status. Adds `hermes tern`."
author: alt-glitch
license: MIT
homepage: https://github.com/Emirfs/hermes-tern
tags: [tern, tui, frontend]
requires_hermes: ">=0.23.0"
provides_tools: [link_pull_request, unlink_pull_request, list_pull_requests, write_review_guide]
config_schema:
  enterprise_hosts:
    type: list
    default: []
    label: GitHub Enterprise hosts
    description: "GitHub Enterprise Server hosts (e.g. github.mycompany.com) whose pull requests the agent may link. github.com is always allowed. Any other host is refused."
